<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900" role="img" aria-labelledby="t d">
  <title id="t">Victor Gabriele De Matteis</title>
  <desc id="d">MSc student in Autonomous Systems and Intelligent Robots. Building intelligent software for real-world problems: robotics and control, perception, on-device AI and industrial optimisation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.6" stop-color="#0b1224"/>
      <stop offset="1" stop-color="#0e1530"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.84" cy="0.2" r="0.45">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.1" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#cffafe"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121a33"/>
      <stop offset="1" stop-color="#0d1428"/>
    </linearGradient>
    <linearGradient id="scanline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flowLine" gradientUnits="userSpaceOnUse" x1="262" y1="0" x2="698" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <clipPath id="frame"><rect width="960" height="900" rx="28"/></clipPath>
    <clipPath id="radarClip"><circle cx="800" cy="180" r="124"/></clipPath>
    <clipPath id="box"><rect x="20" y="20" width="150" height="130" rx="14"/></clipPath>
  </defs>

  <style>
    text { font-family: "Inter", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
    .muted { fill: #8b97b5; }
    .label { font-size: 12px; font-weight: 700; letter-spacing: 1.3px; }
    .ttl { font-size: 20px; font-weight: 750; fill: #f1f5ff; letter-spacing: -0.3px; }
    .sub { font-size: 13.5px; fill: #8b97b5; }
    .tag { font-size: 12px; font-weight: 600; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes rotor { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(0.35); } }
    @keyframes scan { 0% { transform: translateY(0); } 100% { transform: translateY(112px); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes glow { 0%, 100% { opacity: 0.25; transform: scale(0.9); } 50% { opacity: 0.6; transform: scale(1.12); } }
    @keyframes grow { 0% { transform: scaleX(0); } 35%, 100% { transform: scaleX(1); } }
    @keyframes dash { to { stroke-dashoffset: -28; } }
    @keyframes blip { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

    .sweep { transform-origin: 800px 180px; animation: spin 5s linear infinite; }
    .blip1 { animation: blip 2.5s ease-in-out infinite; }
    .blip2 { animation: blip 2.5s ease-in-out 0.8s infinite; }
    .blip3 { animation: blip 2.5s ease-in-out 1.6s infinite; }
    .drone { animation: bob 2.8s ease-in-out infinite; }
    .rotor { transform-box: fill-box; transform-origin: center; animation: rotor 0.18s linear infinite; }
    .scan { animation: scan 2.6s ease-in-out infinite alternate; }
    .live { animation: pulse 2.2s ease-in-out infinite; }
    .chipglow { transform-box: fill-box; transform-origin: center; animation: glow 3s ease-in-out infinite; }
    .bar { transform-box: fill-box; transform-origin: left; animation: grow 5s cubic-bezier(.2,.8,.2,1) infinite; }
    .b2 { animation-delay: 0.25s; } .b3 { animation-delay: 0.5s; } .b4 { animation-delay: 0.75s; }
    .flow { animation: dash 1s linear infinite; }
  </style>

  <g clip-path="url(#frame)">
    <rect width="960" height="900" fill="url(#bg)"/>
    <rect width="960" height="900" fill="url(#dots)"/>
    <rect width="960" height="900" fill="url(#glowA)"/>
    <rect width="960" height="900" fill="url(#glowB)"/>

    <!-- ===================== HEADER ===================== -->
    <g transform="translate(56,64)">
      <rect width="424" height="30" rx="15" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-opacity="0.4"/>
      <circle cx="18" cy="15" r="4.5" fill="#22d3ee" class="live"/>
      <text x="32" y="20" font-size="12" font-weight="700" fill="#a5f3fc" letter-spacing="1">MSc · AUTONOMOUS SYSTEMS &amp; INTELLIGENT ROBOTS</text>
    </g>
    <text x="52" y="164" font-size="62" font-weight="800" fill="url(#name)" letter-spacing="-2">Victor Gabriele</text>
    <text x="52" y="230" font-size="62" font-weight="800" fill="url(#name)" letter-spacing="-2">De Matteis</text>
    <text x="56" y="276" font-size="21" font-weight="500" fill="#e2e8f8">Building intelligent software for real-world problems.</text>
    <text x="56" y="306" font-size="15" class="muted">EURECOM, France  ·  University of Trento, Italy  ·  EIT Digital</text>

    <!-- radar / LiDAR -->
    <g>
      <circle cx="800" cy="180" r="124" fill="#0a1122" stroke="#22d3ee" stroke-opacity="0.35"/>
      <g clip-path="url(#radarClip)">
        <circle cx="800" cy="180" r="84" fill="none" stroke="#22d3ee" stroke-opacity="0.15"/>
        <circle cx="800" cy="180" r="44" fill="none" stroke="#22d3ee" stroke-opacity="0.15"/>
        <path d="M676 180 H924 M800 56 V304" stroke="#22d3ee" stroke-opacity="0.1"/>
        <g class="sweep">
          <path d="M800 180 L924 180 A124 124 0 0 0 887.7 92.3 Z" fill="url(#sweep)"/>
          <path d="M800 180 L924 180" stroke="#67e8f9" stroke-width="1.5" stroke-opacity="0.8"/>
        </g>
        <!-- point cloud -->
        <g fill="#94a3b8" fill-opacity="0.45">
          <circle cx="716" cy="140" r="1.4"/><circle cx="724" cy="214" r="1.4"/><circle cx="742" cy="102" r="1.4"/>
          <circle cx="880" cy="230" r="1.4"/><circle cx="902" cy="166" r="1.4"/><circle cx="750" cy="262" r="1.4"/>
          <circle cx="868" cy="262" r="1.4"/><circle cx="706" cy="190" r="1.4"/><circle cx="910" cy="208" r="1.4"/>
          <circle cx="760" cy="74" r="1.4"/><circle cx="890" cy="130" r="1.4"/><circle cx="730" cy="246" r="1.4"/>
        </g>
        <!-- track cones: yellow left, blue right -->
        <g fill="#facc15">
          <circle cx="762" cy="276" r="4"/><circle cx="764" cy="236" r="4" class="blip1"/><circle cx="770" cy="196" r="4"/>
          <circle cx="782" cy="156" r="4" class="blip2"/><circle cx="800" cy="118" r="4"/><circle cx="822" cy="86" r="4" class="blip3"/>
        </g>
        <g fill="#60a5fa">
          <circle cx="840" cy="276" r="4" class="blip2"/><circle cx="838" cy="236" r="4"/><circle cx="842" cy="198" r="4" class="blip3"/>
          <circle cx="852" cy="162" r="4"/><circle cx="868" cy="130" r="4" class="blip1"/><circle cx="890" cy="102" r="4"/>
        </g>
        <!-- planned path -->
        <path d="M801 190 C 802 150, 818 122, 856 90" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="4 6" class="flow"/>
      </g>
      <!-- car -->
      <path d="M801 168 L810 194 L801 189 L792 194 Z" fill="#ffffff"/>
      <text x="800" y="330" text-anchor="middle" font-size="11" class="mono" fill="#67e8f9" fill-opacity="0.8">lidar · cones · path</text>
    </g>

    <!-- ===================== TILES ===================== -->

    <!-- 1. Robotics & control -->
    <g transform="translate(48,360)">
      <rect width="420" height="170" rx="20" fill="url(#tile)" stroke="#1f2a48"/>
      <rect x="20" y="20" width="150" height="130" rx="14" fill="#0a1122" stroke="#22d3ee" stroke-opacity="0.18"/>
      <g clip-path="url(#box)">
        <path d="M24 134 C 60 96, 120 150, 168 108" fill="none" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="1.6" stroke-dasharray="3 6" class="flow"/>
        <circle cx="146" cy="117" r="5" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
        <circle cx="146" cy="117" r="1.6" fill="#22d3ee"/>
        <ellipse cx="95" cy="132" rx="26" ry="4" fill="#22d3ee" fill-opacity="0.12"/>
        <g class="drone">
          <path d="M52 76 H138" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
          <path d="M56 76 V68 M134 76 V68" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
          <ellipse class="rotor" cx="56" cy="66" rx="20" ry="2.6" fill="#22d3ee" fill-opacity="0.85"/>
          <ellipse class="rotor" cx="134" cy="66" rx="20" ry="2.6" fill="#22d3ee" fill-opacity="0.85"/>
          <rect x="78" y="70" width="34" height="16" rx="6" fill="#22d3ee"/>
          <circle cx="95" cy="91" r="3.5" fill="#0a1122" stroke="#22d3ee" stroke-width="1.6"/>
        </g>
      </g>
      <text x="192" y="44" class="label" fill="#22d3ee">ROBOTICS &amp; CONTROL</text>
      <text x="192" y="74" class="ttl">Stable flight,</text>
      <text x="192" y="98" class="ttl">under constraints</text>
      <text x="192" y="126" class="sub">Quadrotor control · MuJoCo</text>
      <text x="192" y="152" class="tag mono" fill="#67e8f9">→ MCAV</text>
    </g>

    <!-- 2. Perception -->
    <g transform="translate(492,360)">
      <rect width="420" height="170" rx="20" fill="url(#tile)" stroke="#1f2a48"/>
      <rect x="20" y="20" width="150" height="130" rx="14" fill="#0a1122" stroke="#fbbf24" stroke-opacity="0.18"/>
      <g clip-path="url(#box)">
        <path d="M20 150 L84 58 M170 150 L106 58" stroke="#475569" stroke-width="1.5"/>
        <path d="M95 150 V136 M95 124 V110 M95 98 V86 M95 76 V68" stroke="#475569" stroke-width="1.5"/>
        <!-- cones -->
        <path d="M43 132 L50 116 L57 132 Z" fill="#facc15"/>
        <path d="M64 102 L68.5 92 L73 102 Z" fill="#facc15"/>
        <path d="M77 82 L80 75 L83 82 Z" fill="#facc15"/>
        <path d="M133 132 L140 116 L147 132 Z" fill="#60a5fa"/>
        <path d="M117 102 L121.5 92 L126 102 Z" fill="#60a5fa"/>
        <path d="M107 82 L110 75 L113 82 Z" fill="#60a5fa"/>
        <!-- detections -->
        <rect x="38" y="110" width="24" height="27" rx="2" fill="none" stroke="#fbbf24" stroke-width="1.4" stroke-dasharray="3 3"/>
        <rect x="128" y="110" width="24" height="27" rx="2" fill="none" stroke="#fbbf24" stroke-width="1.4" stroke-dasharray="3 3"/>
        <rect x="38" y="99" width="28" height="11" rx="2" fill="#fbbf24"/>
        <text x="52" y="107.5" font-size="8.5" font-weight="700" text-anchor="middle" fill="#1c1404" class="mono">0.98</text>
        <rect x="124" y="99" width="28" height="11" rx="2" fill="#fbbf24"/>
        <text x="138" y="107.5" font-size="8.5" font-weight="700" text-anchor="middle" fill="#1c1404" class="mono">0.97</text>
        <!-- corner brackets -->
        <path d="M30 40 V30 H40 M150 30 H160 V40 M160 130 V140 H150 M40 140 H30 V130" fill="none" stroke="#fbbf24" stroke-opacity="0.6" stroke-width="1.6"/>
        <g class="scan"><rect x="20" y="30" width="150" height="2" fill="url(#scanline)"/></g>
      </g>
      <text x="192" y="44" class="label" fill="#fbbf24">PERCEPTION</text>
      <text x="192" y="74" class="ttl">Seeing the track</text>
      <text x="192" y="98" class="ttl">at racing speed</text>
      <text x="192" y="126" class="sub">LiDAR · C++ · motion estimation</text>
      <text x="192" y="152" class="tag mono" fill="#fcd34d">→ PerceptionPipeline</text>
    </g>

    <!-- 3. On-device AI -->
    <g transform="translate(48,554)">
      <rect width="420" height="170" rx="20" fill="url(#tile)" stroke="#1f2a48"/>
      <rect x="20" y="20" width="150" height="130" rx="14" fill="#0a1122" stroke="#a78bfa" stroke-opacity="0.18"/>
      <g clip-path="url(#box)">
        <circle class="chipglow" cx="95" cy="88" r="44" fill="#a78bfa" fill-opacity="0.25"/>
        <g stroke="#a78bfa" stroke-width="2.4" stroke-linecap="round">
          <path d="M78 52 V60 M90 52 V60 M102 52 V60 M114 52 V60"/>
          <path d="M78 116 V124 M90 116 V124 M102 116 V124 M114 116 V124"/>
          <path d="M59 70 H67 M59 82 H67 M59 94 H67 M59 106 H67"/>
          <path d="M123 70 H131 M123 82 H131 M123 94 H131 M123 106 H131"/>
        </g>
        <rect x="67" y="60" width="56" height="56" rx="9" fill="#1a1440" stroke="#a78bfa" stroke-width="2"/>
        <path d="M87 86 V80 A8 8 0 0 1 103 80 V86" fill="none" stroke="#e9e3ff" stroke-width="2.4"/>
        <rect x="83" y="86" width="24" height="18" rx="3.5" fill="#e9e3ff"/>
        <circle cx="95" cy="94" r="2.6" fill="#1a1440"/>
        <!-- no network -->
        <g transform="translate(144,40)" stroke="#8b97b5" stroke-width="1.8" fill="none" stroke-linecap="round">
          <path d="M-10 0 A14 14 0 0 1 10 0"/>
          <path d="M-6 4 A8 8 0 0 1 6 4"/>
          <circle cx="0" cy="8" r="1.4" fill="#8b97b5"/>
          <path d="M-11 -6 L11 12" stroke="#f472b6" stroke-width="2"/>
        </g>
      </g>
      <text x="192" y="44" class="label" fill="#a78bfa">ON-DEVICE AI</text>
      <text x="192" y="74" class="ttl">Built to translate.</text>
      <text x="192" y="98" class="ttl">Not to transmit.</text>
      <text x="192" y="126" class="sub">llama.cpp · Qt 6 · App Sandbox</text>
      <text x="192" y="152" class="tag mono" fill="#c4b5fd">→ SecureOfflineTranslator</text>
    </g>

    <!-- 4. Optimisation -->
    <g transform="translate(492,554)">
      <rect width="420" height="170" rx="20" fill="url(#tile)" stroke="#1f2a48"/>
      <rect x="20" y="20" width="150" height="130" rx="14" fill="#0a1122" stroke="#34d399" stroke-opacity="0.18"/>
      <g clip-path="url(#box)">
        <path d="M30 48 C 48 30, 62 30, 76 42 S 104 56, 120 38 S 148 30, 160 40" fill="none" stroke="#34d399" stroke-opacity="0.55" stroke-width="1.8"/>
        <rect x="32" y="60" width="62" height="12" rx="4" fill="#34d399" class="bar"/>
        <rect x="70" y="80" width="54" height="12" rx="4" fill="#34d399" fill-opacity="0.7" class="bar b2"/>
        <rect x="46" y="100" width="40" height="12" rx="4" fill="#34d399" fill-opacity="0.5" class="bar b3"/>
        <rect x="96" y="100" width="58" height="12" rx="4" fill="#34d399" fill-opacity="0.85" class="bar b3"/>
        <rect x="104" y="120" width="52" height="12" rx="4" fill="#34d399" fill-opacity="0.6" class="bar b4"/>
        <path d="M30 140 H160" stroke="#334155" stroke-width="1.4"/>
        <path d="M30 140 V136 M56 140 V136 M82 140 V136 M108 140 V136 M134 140 V136 M160 140 V136" stroke="#334155" stroke-width="1.4"/>
      </g>
      <text x="192" y="44" class="label" fill="#34d399">OPTIMISATION</text>
      <text x="192" y="74" class="ttl">Smarter industrial</text>
      <text x="192" y="98" class="ttl">energy schedules</text>
      <text x="192" y="126" class="sub">MILP · simulation · dashboards</text>
      <text x="192" y="152" class="tag mono" fill="#6ee7b7">→ CONCAST</text>
    </g>

    <!-- ===================== JOURNEY ===================== -->
    <text x="480" y="764" text-anchor="middle" class="label muted">IDEA → IMPLEMENTATION → VALIDATION</text>
    <g transform="translate(0,782)">
      <path d="M262 22 H388 M572 22 H698" stroke="url(#flowLine)" stroke-width="2" stroke-dasharray="5 9" class="flow"/>
      <path d="M382 16 L390 22 L382 28 M692 16 L700 22 L692 28" fill="none" stroke="#8b97b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="132" width="128" height="44" rx="22" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="196" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#cffafe">Idea</text>

      <rect x="396" width="168" height="44" rx="22" fill="#a78bfa" fill-opacity="0.1" stroke="#a78bfa" stroke-opacity="0.5"/>
      <text x="480" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#ede9fe">Implementation</text>

      <rect x="706" width="140" height="44" rx="22" fill="#34d399" fill-opacity="0.1" stroke="#34d399" stroke-opacity="0.5"/>
      <path d="M730 22 L736 28 L747 16" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="789" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#d1fae5">Validation</text>
    </g>

    <text x="480" y="866" text-anchor="middle" font-size="13" class="mono" fill="#5b6787">Python · C++ · MATLAB/Simulink · Qt · Django · React · Docker</text>
  </g>
</svg>
