<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">DataGatherer</title>
  <desc id="d">Animation: a feed of post screenshots scrolls in, crop boxes and a scanner read the username and hashtags, and the extracted pieces fly into a user by hashtag matrix whose cells light up.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07110d"/>
      <stop offset="0.55" stop-color="#0b1b15"/>
      <stop offset="1" stop-color="#062a1e"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0.48" cy="0.5" r="0.4">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.85" cy="0.45" r="0.35">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ph1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f3a30"/><stop offset="1" stop-color="#0f2a20"/></linearGradient>
    <linearGradient id="ph2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b3b3a"/><stop offset="1" stop-color="#0e2526"/></linearGradient>
    <linearGradient id="ph3" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#173528"/><stop offset="1" stop-color="#28503e"/></linearGradient>
    <linearGradient id="ph4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22433a"/><stop offset="1" stop-color="#10241d"/></linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a7f3d0" stop-opacity="1"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scanTrail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="fadeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.16" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.84" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="1280" height="640">
      <rect x="60" y="40" width="300" height="560" fill="url(#fadeGrad)"/>
    </mask>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="640" rx="24"/></clipPath>
    <clipPath id="cardClip"><rect width="300" height="440" rx="20"/></clipPath>

    <!-- feed thumbnails -->
    <g id="t1">
      <rect width="210" height="150" rx="12" fill="#12241d" stroke="#24423a"/>
      <circle cx="20" cy="19" r="7" fill="#34d399" fill-opacity="0.8"/>
      <rect x="34" y="14" width="70" height="9" rx="4.5" fill="#d1fae5" fill-opacity="0.7"/>
      <rect x="10" y="36" width="190" height="70" rx="6" fill="url(#ph1)"/>
      <path d="M10 98 L60 66 L88 84 L124 58 L200 96 V100 Q200 106 194 106 H16 Q10 106 10 100 Z" fill="#10b981" fill-opacity="0.22"/>
      <circle cx="168" cy="56" r="8" fill="#a7f3d0" fill-opacity="0.3"/>
      <rect x="10" y="116" width="40" height="8" rx="4" fill="#34d399"/>
      <rect x="56" y="116" width="52" height="8" rx="4" fill="#34d399" fill-opacity="0.7"/>
      <rect x="114" y="116" width="30" height="8" rx="4" fill="#34d399" fill-opacity="0.55"/>
      <rect x="10" y="132" width="120" height="6" rx="3" fill="#8fb8a8" fill-opacity="0.35"/>
    </g>
    <g id="t2">
      <rect width="210" height="150" rx="12" fill="#12241d" stroke="#24423a"/>
      <circle cx="20" cy="19" r="7" fill="#6ee7b7" fill-opacity="0.7"/>
      <rect x="34" y="14" width="54" height="9" rx="4.5" fill="#d1fae5" fill-opacity="0.7"/>
      <rect x="10" y="36" width="190" height="70" rx="6" fill="url(#ph2)"/>
      <rect x="60" y="50" width="90" height="44" rx="8" fill="#34d399" fill-opacity="0.16"/>
      <circle cx="105" cy="72" r="12" fill="#6ee7b7" fill-opacity="0.3"/>
      <rect x="10" y="116" width="58" height="8" rx="4" fill="#34d399" fill-opacity="0.85"/>
      <rect x="74" y="116" width="36" height="8" rx="4" fill="#34d399" fill-opacity="0.6"/>
      <rect x="10" y="132" width="96" height="6" rx="3" fill="#8fb8a8" fill-opacity="0.35"/>
    </g>
    <g id="t3">
      <rect width="210" height="150" rx="12" fill="#12241d" stroke="#24423a"/>
      <circle cx="20" cy="19" r="7" fill="#10b981"/>
      <rect x="34" y="14" width="84" height="9" rx="4.5" fill="#d1fae5" fill-opacity="0.7"/>
      <rect x="10" y="36" width="190" height="70" rx="6" fill="url(#ph3)"/>
      <path d="M10 106 V84 Q50 60 100 82 T200 74 V100 Q200 106 194 106 H16 Q10 106 10 100 Z" fill="#34d399" fill-opacity="0.2"/>
      <circle cx="40" cy="54" r="7" fill="#d1fae5" fill-opacity="0.3"/>
      <rect x="10" y="116" width="34" height="8" rx="4" fill="#34d399" fill-opacity="0.65"/>
      <rect x="50" y="116" width="64" height="8" rx="4" fill="#34d399"/>
      <rect x="120" y="116" width="44" height="8" rx="4" fill="#34d399" fill-opacity="0.5"/>
      <rect x="10" y="132" width="136" height="6" rx="3" fill="#8fb8a8" fill-opacity="0.35"/>
    </g>
    <g id="t4">
      <rect width="210" height="150" rx="12" fill="#12241d" stroke="#24423a"/>
      <circle cx="20" cy="19" r="7" fill="#a7f3d0" fill-opacity="0.7"/>
      <rect x="34" y="14" width="62" height="9" rx="4.5" fill="#d1fae5" fill-opacity="0.7"/>
      <rect x="10" y="36" width="190" height="70" rx="6" fill="url(#ph4)"/>
      <rect x="22" y="48" width="50" height="46" rx="5" fill="#34d399" fill-opacity="0.14"/>
      <rect x="80" y="48" width="50" height="46" rx="5" fill="#34d399" fill-opacity="0.22"/>
      <rect x="138" y="48" width="50" height="46" rx="5" fill="#34d399" fill-opacity="0.1"/>
      <rect x="10" y="116" width="48" height="8" rx="4" fill="#34d399" fill-opacity="0.75"/>
      <rect x="64" y="116" width="44" height="8" rx="4" fill="#34d399" fill-opacity="0.9"/>
      <rect x="10" y="132" width="110" height="6" rx="3" fill="#8fb8a8" fill-opacity="0.35"/>
    </g>
  </defs>

  <style>
    @keyframes feed { from { transform: translateY(0); } to { transform: translateY(-680px); } }
    @keyframes scanY { 0% { transform: translateY(24px); } 100% { transform: translateY(420px); } }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    @keyframes cropPulse { 0%, 100% { opacity: 0.55; } 10%, 30% { opacity: 1; } }
    @keyframes hit { 0%, 46% { opacity: 0; } 52% { opacity: 1; } 80%, 100% { opacity: 0; } }
    @keyframes shimmer { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
    @keyframes doc { 0%, 50% { transform: translateY(0); } 60% { transform: translateY(-6px); } 72%, 100% { transform: translateY(0); } }
    .feed { animation: feed 14s linear infinite; }
    .scanner { animation: scanY 2s ease-in-out infinite alternate; }
    .flow { animation: dash 1s linear infinite; }
    .crop { animation: dash 1.2s linear infinite, cropPulse 2s ease-in-out infinite; }
    .hitA { animation: hit 4s ease-out infinite; }
    .hitB { animation: hit 4s ease-out 2s infinite; opacity: 0; }
    .hitA { opacity: 0; }
    .sh1 { animation: shimmer 3.2s ease-in-out infinite; }
    .sh2 { animation: shimmer 3.2s ease-in-out 1.1s infinite; }
    .sh3 { animation: shimmer 3.2s ease-in-out 2.2s infinite; }
    .doc { animation: doc 2s ease-in-out infinite; }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1280" height="640" fill="url(#bg)"/>
    <rect width="1280" height="640" fill="url(#dots)"/>
    <rect width="1280" height="640" fill="url(#glowC)"/>
    <rect width="1280" height="640" fill="url(#glowR)"/>

    <!-- ============ FEED (left) ============ -->
    <g mask="url(#fade)">
      <g class="feed">
        <use href="#t1" xlink:href="#t1" x="105" y="40"/>
        <use href="#t2" xlink:href="#t2" x="105" y="210"/>
        <use href="#t3" xlink:href="#t3" x="105" y="380"/>
        <use href="#t4" xlink:href="#t4" x="105" y="550"/>
        <use href="#t1" xlink:href="#t1" x="105" y="720"/>
        <use href="#t2" xlink:href="#t2" x="105" y="890"/>
        <use href="#t3" xlink:href="#t3" x="105" y="1060"/>
        <use href="#t4" xlink:href="#t4" x="105" y="1230"/>
      </g>
    </g>

    <!-- feed → card -->
    <g transform="translate(346,320)">
      <path d="M0 0 H84" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 8" class="flow"/>
      <path d="M80 -7 L92 0 L80 7" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- ============ ACTIVE CARD (center) ============ -->
    <g transform="translate(470,100)">
      <g transform="rotate(-7 150 220) translate(-30,12)" opacity="0.3">
        <rect width="300" height="440" rx="20" fill="#12211b" stroke="#2a4a3d"/>
      </g>
      <g transform="rotate(-3.5 150 220) translate(-14,5)" opacity="0.55">
        <rect width="300" height="440" rx="20" fill="#132520" stroke="#2a4a3d"/>
        <rect x="18" y="66" width="264" height="190" rx="10" fill="url(#ph2)"/>
      </g>

      <rect width="300" height="440" rx="20" fill="#152a22" stroke="#2f5646" stroke-width="1.4"/>
      <g clip-path="url(#cardClip)">
        <circle cx="36" cy="36" r="15" fill="#34d399" fill-opacity="0.9"/>
        <rect x="60" y="28" width="120" height="16" rx="8" fill="#e5fff4" fill-opacity="0.9"/>
        <circle cx="258" cy="36" r="2.6" fill="#8fb8a8"/><circle cx="268" cy="36" r="2.6" fill="#8fb8a8"/><circle cx="278" cy="36" r="2.6" fill="#8fb8a8"/>
        <rect x="18" y="66" width="264" height="190" rx="10" fill="url(#ph1)"/>
        <path d="M18 226 L92 160 L140 200 L196 142 L282 222 V246 Q282 256 272 256 H28 Q18 256 18 246 Z" fill="#10b981" fill-opacity="0.24"/>
        <circle cx="232" cy="108" r="18" fill="#a7f3d0" fill-opacity="0.35"/>
        <rect x="18" y="276" width="220" height="10" rx="5" fill="#8fb8a8" fill-opacity="0.55"/>
        <rect x="18" y="296" width="170" height="10" rx="5" fill="#8fb8a8" fill-opacity="0.4"/>
        <rect x="18" y="326" width="70" height="14" rx="7" fill="#34d399" class="sh1"/>
        <rect x="94" y="326" width="92" height="14" rx="7" fill="#34d399" fill-opacity="0.8" class="sh2"/>
        <rect x="192" y="326" width="60" height="14" rx="7" fill="#34d399" fill-opacity="0.65" class="sh3"/>
        <rect x="18" y="350" width="84" height="14" rx="7" fill="#34d399" fill-opacity="0.75" class="sh2"/>
        <rect x="108" y="350" width="64" height="14" rx="7" fill="#34d399" fill-opacity="0.6" class="sh1"/>
        <rect x="18" y="390" width="40" height="10" rx="5" fill="#8fb8a8" fill-opacity="0.3"/>
        <rect x="64" y="390" width="40" height="10" rx="5" fill="#8fb8a8" fill-opacity="0.3"/>

        <g class="scanner">
          <rect x="0" y="-60" width="300" height="60" fill="url(#scanTrail)"/>
          <rect x="0" y="-2" width="300" height="4" fill="url(#scan)"/>
        </g>
      </g>

      <!-- crop boxes + handles -->
      <rect x="50" y="20" width="140" height="32" rx="6" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-dasharray="7 5" class="crop"/>
      <rect x="8" y="316" width="284" height="58" rx="8" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-dasharray="7 5" class="crop"/>
      <g fill="#6ee7b7">
        <rect x="46" y="16" width="8" height="8" rx="2"/><rect x="186" y="16" width="8" height="8" rx="2"/>
        <rect x="46" y="48" width="8" height="8" rx="2"/><rect x="186" y="48" width="8" height="8" rx="2"/>
        <rect x="4" y="312" width="8" height="8" rx="2"/><rect x="288" y="312" width="8" height="8" rx="2"/>
        <rect x="4" y="370" width="8" height="8" rx="2"/><rect x="288" y="370" width="8" height="8" rx="2"/>
      </g>
    </g>

    <!-- ============ MATRIX (right) ============ -->
    <g>
      <rect x="866" y="120" width="368" height="330" rx="18" fill="#0b1b15" stroke="#2f5646"/>
      <!-- column headers (users) -->
      <g fill="#8fb8a8" fill-opacity="0.45">
        <rect x="944" y="146" width="32" height="8" rx="4"/><rect x="992" y="146" width="32" height="8" rx="4"/>
        <rect x="1040" y="146" width="32" height="8" rx="4"/><rect x="1088" y="146" width="32" height="8" rx="4"/>
        <rect x="1136" y="146" width="32" height="8" rx="4"/><rect x="1184" y="146" width="32" height="8" rx="4"/>
      </g>
      <!-- row headers (hashtags) -->
      <g fill="#8fb8a8" fill-opacity="0.45">
        <rect x="886" y="196" width="40" height="8" rx="4"/><rect x="886" y="244" width="34" height="8" rx="4"/>
        <rect x="886" y="292" width="44" height="8" rx="4"/><rect x="886" y="340" width="30" height="8" rx="4"/>
        <rect x="886" y="388" width="38" height="8" rx="4"/>
      </g>
      <!-- cells: x = 940 + 48c, y = 180 + 48r -->
      <g fill="#34d399">
        <rect x="940"  y="180" width="40" height="40" rx="7" fill-opacity="0.9"/>
        <rect x="988"  y="180" width="40" height="40" rx="7" fill-opacity="0.35"/>
        <rect x="1036" y="180" width="40" height="40" rx="7" fill-opacity="0.08"/>
        <rect x="1084" y="180" width="40" height="40" rx="7" fill-opacity="0.65"/>
        <rect x="1132" y="180" width="40" height="40" rx="7" fill-opacity="0.18"/>
        <rect x="1180" y="180" width="40" height="40" rx="7" fill-opacity="0.5"/>

        <rect x="940"  y="228" width="40" height="40" rx="7" fill-opacity="0.25"/>
        <rect x="988"  y="228" width="40" height="40" rx="7" fill-opacity="0.8"/>
        <rect x="1036" y="228" width="40" height="40" rx="7" fill-opacity="0.45"/>
        <rect x="1084" y="228" width="40" height="40" rx="7" fill-opacity="0.08"/>
        <rect x="1132" y="228" width="40" height="40" rx="7" fill-opacity="0.6"/>
        <rect x="1180" y="228" width="40" height="40" rx="7" fill-opacity="0.12"/>

        <rect x="940"  y="276" width="40" height="40" rx="7" fill-opacity="0.55"/>
        <rect x="988"  y="276" width="40" height="40" rx="7" fill-opacity="0.12"/>
        <rect x="1036" y="276" width="40" height="40" rx="7" fill-opacity="1"/>
        <rect x="1084" y="276" width="40" height="40" rx="7" fill-opacity="0.35"/>
        <rect x="1132" y="276" width="40" height="40" rx="7" fill-opacity="0.2"/>
        <rect x="1180" y="276" width="40" height="40" rx="7" fill-opacity="0.75"/>

        <rect x="940"  y="324" width="40" height="40" rx="7" fill-opacity="0.08"/>
        <rect x="988"  y="324" width="40" height="40" rx="7" fill-opacity="0.55"/>
        <rect x="1036" y="324" width="40" height="40" rx="7" fill-opacity="0.22"/>
        <rect x="1084" y="324" width="40" height="40" rx="7" fill-opacity="0.85"/>
        <rect x="1132" y="324" width="40" height="40" rx="7" fill-opacity="0.4"/>
        <rect x="1180" y="324" width="40" height="40" rx="7" fill-opacity="0.08"/>

        <rect x="940"  y="372" width="40" height="40" rx="7" fill-opacity="0.7"/>
        <rect x="988"  y="372" width="40" height="40" rx="7" fill-opacity="0.18"/>
        <rect x="1036" y="372" width="40" height="40" rx="7" fill-opacity="0.4"/>
        <rect x="1084" y="372" width="40" height="40" rx="7" fill-opacity="0.12"/>
        <rect x="1132" y="372" width="40" height="40" rx="7" fill-opacity="0.95"/>
        <rect x="1180" y="372" width="40" height="40" rx="7" fill-opacity="0.3"/>
      </g>

      <!-- hit A: column 2 (x 1040) × row 1 (y 228) -->
      <g class="hitA">
        <rect x="1036" y="228" width="40" height="40" rx="7" fill="#a7f3d0" stroke="#ecfdf5" stroke-width="2"/>
        <rect x="1030" y="222" width="52" height="52" rx="11" fill="none" stroke="#6ee7b7" stroke-opacity="0.6" stroke-width="2"/>
        <rect x="1040" y="146" width="32" height="8" rx="4" fill="#6ee7b7"/>
        <rect x="886" y="244" width="34" height="8" rx="4" fill="#6ee7b7"/>
      </g>
      <!-- hit B: column 4 (x 1136) × row 3 (y 324) -->
      <g class="hitB">
        <rect x="1132" y="324" width="40" height="40" rx="7" fill="#a7f3d0" stroke="#ecfdf5" stroke-width="2"/>
        <rect x="1126" y="318" width="52" height="52" rx="11" fill="none" stroke="#6ee7b7" stroke-opacity="0.6" stroke-width="2"/>
        <rect x="1136" y="146" width="32" height="8" rx="4" fill="#6ee7b7"/>
        <rect x="886" y="340" width="30" height="8" rx="4" fill="#6ee7b7"/>
      </g>

      <!-- exported CSV -->
      <g transform="translate(1022,476)">
        <g class="doc">
          <path d="M0 0 H40 L56 16 V76 Q56 82 50 82 H6 Q0 82 0 76 Z" fill="#132a22" stroke="#34d399" stroke-width="1.8"/>
          <path d="M40 0 V16 H56" fill="none" stroke="#34d399" stroke-width="1.8" stroke-linejoin="round"/>
          <g stroke="#34d399" stroke-opacity="0.7" stroke-width="1.6">
            <path d="M10 32 H46 M10 46 H46 M10 60 H46 M22 26 V68 M34 26 V68"/>
          </g>
        </g>      </g>
      <path d="M1050 452 V470" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 5" class="flow"/>
    </g>

    <!-- ============ PARTICLES (card → matrix) ============ -->
    <!-- pair A: username → column 2, hashtag → row 1 -->
    <g opacity="0">
      <rect x="-14" y="-5" width="28" height="10" rx="5" fill="#e5fff4"/>
      <animateMotion dur="4s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.12;0.46;1"
        path="M662 136 C 780 70, 960 70, 1056 150"/>
      <animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1;0.14;0.44;0.48;1"/>
    </g>
    <g opacity="0">
      <rect x="-16" y="-6" width="32" height="12" rx="6" fill="#34d399"/>
      <animateMotion dur="4s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.12;0.46;1"
        path="M764 446 C 830 420, 830 260, 906 248"/>
      <animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1;0.14;0.44;0.48;1"/>
    </g>
    <!-- pair B: username → column 4, hashtag → row 3 -->
    <g opacity="0">
      <rect x="-14" y="-5" width="28" height="10" rx="5" fill="#e5fff4"/>
      <animateMotion dur="4s" begin="2s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.12;0.46;1"
        path="M662 136 C 800 40, 1060 60, 1152 150"/>
      <animate attributeName="opacity" dur="4s" begin="2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1;0.14;0.44;0.48;1"/>
    </g>
    <g opacity="0">
      <rect x="-16" y="-6" width="32" height="12" rx="6" fill="#34d399"/>
      <animateMotion dur="4s" begin="2s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.12;0.46;1"
        path="M764 446 C 840 450, 840 350, 902 344"/>
      <animate attributeName="opacity" dur="4s" begin="2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1;0.14;0.44;0.48;1"/>
    </g>

    <!-- faint guide paths -->
    <g fill="none" stroke="#34d399" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="3 7">
      <path d="M662 136 C 780 70, 960 70, 1056 150"/>
      <path d="M764 446 C 830 420, 830 260, 906 248"/>
    </g>
  </g>
</svg>
