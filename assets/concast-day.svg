<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 60 1200 410" width="1200" height="410" role="img" aria-labelledby="t d">
<title id="t">A day in SPARC</title>
<desc id="d">Over 24 hours, shiftable production phases slide by up to two hours into the solar generation peak and away from expensive grid hours, while the cold room pre-cools on surplus renewable energy and stays inside its temperature band.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0B1A2E"/><stop offset="1" stop-color="#06101D"/>
  </linearGradient>
  <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFC94A" stop-opacity="0.85"/>
    <stop offset="1" stop-color="#FF9F1C" stop-opacity="0.05"/>
  </linearGradient>
  <linearGradient id="shift" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3FB4FF"/><stop offset="1" stop-color="#7AD3FF"/>
  </linearGradient>
  <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3FB4FF" stop-opacity="0.04"/>
    <stop offset="1" stop-color="#3FB4FF" stop-opacity="0.16"/>
  </linearGradient>
  <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#22344D"/><line x1="0" y1="0" x2="0" y2="7" stroke="#3A5272" stroke-width="3"/>
  </pattern>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#FFFFFF" stroke-opacity="0.025"/>
  </pattern>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .lane { fill: #6F89AB; font-size: 11px; letter-spacing: 2px; font-weight: 600; }
  .lbl { fill: #9FB4D0; font-size: 11px; }
  .tick { fill: #5C7393; font-size: 11px; }
  .leg { fill: #C9D6E8; font-size: 12px; }
</style>
<rect y="60" width="1200" height="410" rx="18" fill="url(#bg)"/>
<rect y="60" width="1200" height="410" rx="18" fill="url(#grid)"/>





