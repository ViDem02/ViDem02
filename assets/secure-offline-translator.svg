<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="t d">
  <title id="t">Translation that stays on the device</title>
  <desc id="d">Animation: source text flows into an on-device model inside a locked boundary and the translation is written out on the other side, while a network request is stopped at the boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="frame"><rect width="960" height="480" rx="24"/></clipPath>
    <clipPath id="ln0"><rect x="592" y="184" width="0" height="12">
      <animate attributeName="width" values="0;0;140;140;0" keyTimes="0;0.08;0.17;0.94;1" dur="6s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="ln1"><rect x="592" y="210" width="0" height="12">
      <animate attributeName="width" values="0;0;156;156;0" keyTimes="0;0.18;0.27;0.94;1" dur="6s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="ln2"><rect x="592" y="236" width="0" height="12">
      <animate attributeName="width" values="0;0;118;118;0" keyTimes="0;0.28;0.37;0.94;1" dur="6s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="ln3"><rect x="592" y="262" width="0" height="12">
      <animate attributeName="width" values="0;0;150;150;0" keyTimes="0;0.38;0.47;0.94;1" dur="6s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="ln4"><rect x="592" y="288" width="0" height="12">
      <animate attributeName="width" values="0;0;104;104;0" keyTimes="0;0.48;0.57;0.94;1" dur="6s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="ln5"><rect x="592" y="314" width="0" height="12">
      <animate attributeName="width" values="0;0;132;132;0" keyTimes="0;0.58;0.67;0.94;1" dur="6s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="ln6"><rect x="592" y="340" width="0" height="12">
      <animate attributeName="width" values="0;0;90;90;0" keyTimes="0;0.68;0.77;0.94;1" dur="6s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="960" height="480" fill="url(#bg)"/>
    <rect width="960" height="480" fill="url(#grid)"/>

    <!-- device boundary -->
    <rect x="150" y="76" width="660" height="340" fill="#a78bfa" fill-opacity="0.03" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="1.6"/>
    <g transform="translate(480,76)">
      <rect x="-18" y="-18" width="36" height="36" fill="#0e1528" stroke="#a78bfa" stroke-width="1.6"/>
      <path d="M-6 -1 V-6 A6 6 0 0 1 6 -6 V-1" fill="none" stroke="#ede9fe" stroke-width="2"/>
      <rect x="-9" y="-1" width="18" height="12" fill="#ede9fe"/>
    </g>

    <rect x="196" y="128" width="192" height="244" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="216" y="150" width="56" height="12" fill="#a78bfa" fill-opacity="0.45"/>
    <rect x="216" y="186" width="150" height="8" fill="#cbd5e1" fill-opacity="0.35"/><rect x="216" y="212" width="128" height="8" fill="#cbd5e1" fill-opacity="0.35"/><rect x="216" y="238" width="160" height="8" fill="#cbd5e1" fill-opacity="0.35"/><rect x="216" y="264" width="112" height="8" fill="#cbd5e1" fill-opacity="0.35"/><rect x="216" y="290" width="146" height="8" fill="#cbd5e1" fill-opacity="0.35"/><rect x="216" y="316" width="96" height="8" fill="#cbd5e1" fill-opacity="0.35"/><rect x="216" y="342" width="138" height="8" fill="#cbd5e1" fill-opacity="0.35"/>
    <rect x="208" y="182" width="168" height="16" fill="#a78bfa" fill-opacity="0.18">
      <animate attributeName="y" values="182;208;234;260;286;312;338;182" dur="6s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>

    <rect x="572" y="128" width="192" height="244" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="592" y="150" width="56" height="12" fill="#a78bfa" fill-opacity="0.45"/>
    <rect x="592" y="186" width="140" height="8" fill="#ede9fe" fill-opacity="0.8" clip-path="url(#ln0)"/><rect x="592" y="212" width="156" height="8" fill="#ede9fe" fill-opacity="0.8" clip-path="url(#ln1)"/><rect x="592" y="238" width="118" height="8" fill="#ede9fe" fill-opacity="0.8" clip-path="url(#ln2)"/><rect x="592" y="264" width="150" height="8" fill="#ede9fe" fill-opacity="0.8" clip-path="url(#ln3)"/><rect x="592" y="290" width="104" height="8" fill="#ede9fe" fill-opacity="0.8" clip-path="url(#ln4)"/><rect x="592" y="316" width="132" height="8" fill="#ede9fe" fill-opacity="0.8" clip-path="url(#ln5)"/><rect x="592" y="342" width="90" height="8" fill="#ede9fe" fill-opacity="0.8" clip-path="url(#ln6)"/>

    <!-- on-device model -->
    <rect x="410" y="180" width="140" height="140" fill="#a78bfa" fill-opacity="0.12">
      <animate attributeName="fill-opacity" values="0.05;0.22;0.05" dur="3s" repeatCount="indefinite"/>
    </rect>
    <path d="M447 196 V206 M447 294 V304 M468 196 V206 M468 294 V304 M489 196 V206 M489 294 V304 M510 196 V206 M510 294 V304 M426 217 H436 M524 217 H534 M426 238 H436 M524 238 H534 M426 259 H436 M524 259 H534 M426 280 H436 M524 280 H534" stroke="#a78bfa" stroke-width="2.4"/>
    <rect x="436" y="206" width="88" height="88" fill="#1a1440" stroke="#a78bfa" stroke-width="2"/>
    <rect x="462" y="232" width="8" height="8" fill="#ede9fe"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" begin="0.00s" repeatCount="indefinite"/></rect><rect x="475" y="232" width="8" height="8" fill="#ede9fe"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" begin="0.17s" repeatCount="indefinite"/></rect><rect x="488" y="232" width="8" height="8" fill="#ede9fe"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" begin="0.34s" repeatCount="indefinite"/></rect><rect x="462" y="245" width="8" height="8" fill="#ede9fe"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" begin="0.51s" repeatCount="indefinite"/></rect><rect x="475" y="245" width="8" height="8" fill="#ede9fe"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" begin="0.68s" repeatCount="indefinite"/></rect><rect x="488" y="245" width="8" height="8" fill="#ede9fe"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" begin="0.85s" repeatCount="indefinite"/></rect><rect x="462" y="258" width="8" height="8" fill="#ede9fe"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" begin="1.02s" repeatCount="indefinite"/></rect><rect x="475" y="258" width="8" height="8" fill="#ede9fe"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" begin="1.19s" repeatCount="indefinite"/></rect><rect x="488" y="258" width="8" height="8" fill="#ede9fe"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" begin="1.36s" repeatCount="indefinite"/></rect>

    <rect x="-5" y="-5" width="10" height="10" fill="#cbd5e1">
        <animateMotion path="M388 250 H438" dur="1.5s" begin="0.0s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="1.5s" begin="0.0s" repeatCount="indefinite"/>
      </rect><rect x="-5" y="-5" width="10" height="10" fill="#a78bfa">
        <animateMotion path="M522 250 H580" dur="1.5s" begin="0.25s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="1.5s" begin="0.25s" repeatCount="indefinite"/>
      </rect><rect x="-5" y="-5" width="10" height="10" fill="#cbd5e1">
        <animateMotion path="M388 250 H438" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
      </rect><rect x="-5" y="-5" width="10" height="10" fill="#a78bfa">
        <animateMotion path="M522 250 H580" dur="1.5s" begin="0.75s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="1.5s" begin="0.75s" repeatCount="indefinite"/>
      </rect><rect x="-5" y="-5" width="10" height="10" fill="#cbd5e1">
        <animateMotion path="M388 250 H438" dur="1.5s" begin="1.0s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="1.5s" begin="1.0s" repeatCount="indefinite"/>
      </rect><rect x="-5" y="-5" width="10" height="10" fill="#a78bfa">
        <animateMotion path="M522 250 H580" dur="1.5s" begin="1.25s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="1.5s" begin="1.25s" repeatCount="indefinite"/>
      </rect>

    <!-- blocked network -->
    <g transform="translate(888,150)" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round">
      <path d="M-26 12 H22 A12 12 0 0 0 20 -12 A18 18 0 0 0 -14 -16 A13 13 0 0 0 -26 12 Z"/>
    </g>
    <path d="M810 150 H858" stroke="#f472b6" stroke-opacity="0.5" stroke-width="1.6" stroke-dasharray="4 5"/>
    <path d="M826 142 L842 158 M842 142 L826 158" stroke="#f472b6" stroke-width="2.2" stroke-linecap="round"/>
    <circle r="5" fill="#f472b6">
      <animateMotion path="M480 180 V150 H806" dur="4s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.4;1"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.4;0.42;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="810" cy="150" r="0" fill="none" stroke="#f472b6" stroke-width="2">
      <animate attributeName="r" values="0;0;18;18" keyTimes="0;0.4;0.6;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0;0.9;0;0" keyTimes="0;0.4;0.6;1" dur="4s" repeatCount="indefinite"/>
    </circle>

  </g>
  <rect x="0.5" y="0.5" width="959" height="479" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
